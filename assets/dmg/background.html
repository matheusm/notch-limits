<!doctype html>
<html><head><meta charset="utf-8">
<!-- Fundo da janela do DMG (660x400). Renderizado em 1x e 2x e combinado em background.tiff pelo build -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body {
    font-family: "Geist", -apple-system, sans-serif; color: #f5f5f7; -webkit-font-smoothing: antialiased;
    background: radial-gradient(520px 300px at 50% -60px, #1b1d22 0%, transparent 72%), #08090b;
    position: relative;
  }
  .pill {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 236px; height: 30px; background: #000; border-radius: 0 0 12px 12px;
    display: grid; grid-template-columns: 58px 1fr 58px; align-items: center;
    box-shadow: 0 10px 24px -10px rgba(0,0,0,.9);
  }
  .ear { display: flex; justify-content: center; gap: 5px; }
  .ring { width: 18px; height: 18px; display: block; overflow: visible; }
  .ring .track { fill: none; stroke: rgba(255,255,255,.22); stroke-width: 3.2; }
  .ring .fill { fill: none; stroke: #d1d1d1; stroke-width: 3.2; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .ring .glyph { fill: #fff; } .ring .glyph--stroke { fill: none; stroke: #fff; stroke-width: 1.7; }
  .arrow { position: absolute; left: 268px; top: 178px; width: 124px; height: 24px; }
  .copy { position: absolute; left: 0; right: 0; top: 318px; text-align: center; }
  .copy b { display: block; font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: #e8e8ec; }
  .copy span { display: block; margin-top: 6px; font-size: 12px; color: #7a7a82; }
</style></head>
<body>
